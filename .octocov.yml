# see https://github.com/k1LoW/octocov
coverage:
  if: true
  paths:
    - UTF.Analyzers~/UTF.Analyzers.Tests/coverage.cobertura.xml

codeToTestRatio:
  code:
    - 'UTF.Analyzers~/UTF.Analyzers/**/*.cs'
  test:
    - 'UTF.Analyzers~/UTF.Analyzers.Tests/**/*.cs'

testExecutionTime:
  if: true

diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}

# Comment report to pull request
comment:
  if: is_pull_request

# Add report to job summary page
summary:
  if: true

# Store report to artifact
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
