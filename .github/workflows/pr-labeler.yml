name: PR Labeler

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  pr-labeler:
    if: github.event.pull_request.head.repo.fork == false # Skip on public fork
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7.7.0
        with:
          config-name: release-drafter.yml
