name: Create release pull request
# Must manually add the label `skip-changelog` to the repository before running this workflow.

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  create-release-pr:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get draft release version
        uses: cardinalby/git-get-release-action@2ab178299eecb253f820dcf2cce11f62be1178f7 # v1.2.6
        with:
          latest: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: get-draft-release
        # Fail this step if not found draft release

      - name: Generate next version number (remove prefix)
        run: |
          tag_with_prefix=${{ steps.get-draft-release.outputs.tag_name }}
          without_prefix=${tag_with_prefix:1}
          echo "version=$without_prefix" >> "$GITHUB_OUTPUT"
        id: next-version

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master

      - name: Bump version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b release/${{ steps.next-version.outputs.version }}
          npm version --no-git-tag-version ${{ steps.next-version.outputs.version }}
          sed -i "s|<Version>[^<]*</Version>|<Version>${{ steps.next-version.outputs.version }}</Version>|" "$ANALYZER_DIR/UTF.Analyzers.csproj"
          printf '\n## Release %s\n\n' "${{ steps.next-version.outputs.version }}" >> "$ANALYZER_DIR/AnalyzerReleases.Shipped.md"
          cat "$ANALYZER_DIR/AnalyzerReleases.Unshipped.md" >> "$ANALYZER_DIR/AnalyzerReleases.Shipped.md"
          printf '### New Rules\n\nRule ID | Category | Severity | Notes\n--------|----------|----------|-------\n' > "$ANALYZER_DIR/AnalyzerReleases.Unshipped.md"
          git add .
          git commit -m"Bump version to v${{ steps.next-version.outputs.version }}"
        env:
          ANALYZER_DIR: UTF.Analyzers~/UTF.Analyzers

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and commit analyzer DLL
        run: |
          dotnet build -c Release UTF.Analyzers~/UTF.Analyzers/UTF.Analyzers.csproj
          git add Analyzers/UTF.Analyzers/UTF.Analyzers.dll
          git commit -m"Build analyzer DLL v${{ steps.next-version.outputs.version }}"

      - name: Create pull-request
        run: |
          git push origin HEAD
          gh pr create --title "Release v${{ steps.next-version.outputs.version }}" --body-file ".github/release-pr-template.md" --reviewer ${{ github.actor }} --label "skip-changelog"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
