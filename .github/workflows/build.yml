name: Build

on:
  push:
    branches: [master]
    tags: ['v*']        # required so the workflow fires on release tags → publish job
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release UTF.Analyzers~/UTF.Analyzers.sln

      - name: Test
        run: dotnet test -c Release UTF.Analyzers~/UTF.Analyzers.sln --no-build

      - name: Pack
        run: dotnet pack UTF.Analyzers~/UTF.Analyzers/UTF.Analyzers.csproj -c Release

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UTF.Analyzers
          path: UTF.Analyzers~/UTF.Analyzers/bin/Release/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for nuget/login (Trusted Publishing)
      contents: read
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: UTF.Analyzers
          path: nupkg

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          nupkg=$(ls nupkg/*.nupkg)
          pkg_version=$(unzip -p "$nupkg" '*.nuspec' | grep -oPm1 '(?<=<version>)[^<]+')
          echo "Tag version:     $tag"
          echo "Package version: $pkg_version"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag) does not match package version ($pkg_version)"
            exit 1
          fi

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push nupkg/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
